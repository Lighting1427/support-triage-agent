[project]
name = "support-triage-agent"
version = "0.1.0"
description = "LangGraph agent that triages customer support tickets with OpenAI GPT models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
triage = "triage_agent.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    'ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning:langsmith\._internal\._beta_decorator',
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
